{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}

{% block content %}
<div class="post-header">
  <h1>{{ page.title }}</h1>
  <time>{{ page.date }}</time>
</div>
<div class="post-body">
  {{ page.content | safe }}
</div>
<a href="/blog" class="back-link">← Back to blog</a>
{% endblock content %}
