{% extends "base.html" %}

{% block title %}Blog — {{ config.title }}{% endblock title %}

{% block content %}
<h1>Blog</h1>
<ul>
  {% for page in section.pages %}
  <li>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    <small>— {{ page.date }}</small>
  </li>
  {% else %}
  <li>No posts yet.</li>
  {% endfor %}
</ul>
{% endblock content %}
