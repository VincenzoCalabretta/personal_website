{% extends "base.html" %}

{% block title %}Blog — {{ config.title }}{% endblock title %}

{% block content %}
<h1>Blog</h1>

<ul class="post-list">
  {% for page in section.pages %}
  <li>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    <time>{{ page.date }}</time>
  </li>
  {% else %}
  <li><span>No posts yet.</span></li>
  {% endfor %}
</ul>
{% endblock content %}
