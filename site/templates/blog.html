{% extends "base.html" %}

{% block title %}Blog &#8212; {{ config.title }}{% endblock title %}

{% block content %}
<h1>Blog</h1>
<ul>
  {% for page in section.pages %}
  <li>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    <small>&#8212; {{ page.date }}</small>
  </li>
  {% else %}
  <li><i>No posts yet.</i></li>
  {% endfor %}
</ul>
{% endblock content %}
